name: Build release packages

# 三种触发方式，任选：
#   1. 推代码到 main  → 自动构建，产物在该次运行的 Artifacts 里（30 天有效）
#   2. 手动触发       → 仓库 Actions 页面 → Build release packages → Run workflow
#   3. 打 tag         → git tag v3.4.1.1 && git push origin v3.4.1.1
#                       构建完会自动发布到 Releases 页面（含规范命名的 zip）
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write          # 发布 Release 需要写权限

jobs:
  build:
    name: build-${{ matrix.slug }}
    runs-on: ${{ matrix.os }}
    env:
      # tag 触发 → 用 tag 名（v3.4.1.1）；推 main / 手动触发 → dev
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
      # Windows 控制台默认 cp1252，强制 UTF-8 免得打印中文时崩
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        # ⚠️ CLI 与 GUI 必须输出到不同目录（dist/cli、dist/gui）：
        #    macOS 文件系统不区分大小写，inklimner(CLI) 与 InkLimner(GUI)
        #    算同一个名字 —— 后构建的 GUI 会顶掉 CLI 产物，冒烟测试执行时报
        #    PermissionError: [Errno 13]（路径变成了一个目录）。
        include:
          - os: windows-latest
            slug: windows
            cli_path: dist/cli/inklimner.exe
            gui_path: dist/gui/InkLimner
          - os: macos-latest
            slug: macos
            cli_path: dist/cli/inklimner
            gui_path: dist/gui/InkLimner.app
          - os: ubuntu-latest
            slug: linux
            cli_path: dist/cli/inklimner
            gui_path: dist/gui/InkLimner
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install opencv-python-headless numpy pyinstaller PySide6-Essentials

      - name: Build CLI (single file)
        run: >
          python -m PyInstaller --noconfirm --onefile --name inklimner
          --distpath dist/cli --workpath build/cli
          --exclude-module PySide6 --exclude-module shiboken6
          inklimner.py

      - name: Build GUI (folder bundle, double-click to run)
        run: >
          python -m PyInstaller --noconfirm --name InkLimner --windowed
          --distpath dist/gui --workpath build/gui
          --exclude-module tkinter --exclude-module PIL
          inklimner_gui.py

      - name: Smoke test the built executables
        run: python tools/smoke_test.py

      # ---------- 上传 artifacts（下载后解压即可直接运行） ----------
      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: InkLimner-${{ env.RELEASE_TAG }}-${{ matrix.slug }}-cli
          path: ${{ matrix.cli_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload GUI artifact
        uses: actions/upload-artifact@v4
        with:
          name: InkLimner-${{ env.RELEASE_TAG }}-${{ matrix.slug }}-gui
          path: ${{ matrix.gui_path }}
          if-no-files-found: error
          retention-days: 30

      # ---------- 打成规范命名的 zip（给 Release 用） ----------
      - name: Package release zips
        run: >
          python tools/make_release.py
          --slug ${{ matrix.slug }} --version ${{ env.RELEASE_TAG }}

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          generate_release_notes: true

      - name: Job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## InkLimner ${{ env.RELEASE_TAG }} · ${{ matrix.slug }}"
            echo ""
            echo "| 产物 | 路径 | 大小 |"
            echo "|---|---|---|"
            for p in "${{ matrix.cli_path }}" "${{ matrix.gui_path }}"; do
              sz=$(du -sh "$p" 2>/dev/null | cut -f1)
              echo "| \`$(basename "$p")\` | \`$p\` | ${sz:-缺失} |"
            done
            echo ""
            echo "### dist 树"
            echo '```'
            find dist -maxdepth 2 2>/dev/null || echo "(no dist)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
