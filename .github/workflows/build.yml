name: Build release packages

# 手动触发：仓库 Actions 页面 → Build release packages → Run workflow
# 打 tag 触发：git tag v3.4.1.1 && git push origin v3.4.1.1（会自动发布到 Releases）
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write          # 发布 Release 需要写权限

jobs:
  build:
    name: build-${{ matrix.slug }}
    runs-on: ${{ matrix.os }}
    env:
      # tag 触发时用 tag 名（v3.4.1.1），手动触发时用 dev
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            slug: windows
          - os: macos-latest
            slug: macos
          - os: ubuntu-latest
            slug: linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install opencv-python-headless numpy pyinstaller PySide6-Essentials

      - name: Build CLI (single file)
        run: >
          python -m PyInstaller --noconfirm --onefile --name inklimner
          --exclude-module PySide6 --exclude-module shiboken6
          inklimner.py

      - name: Build GUI (folder bundle, double-click to run)
        run: >
          python -m PyInstaller --noconfirm --name InkLimner --windowed
          --exclude-module tkinter --exclude-module PIL
          inklimner_gui.py

      - name: Smoke test the built executables
        run: python tools/smoke_test.py

      - name: Package into zips
        run: >
          python tools/make_release.py
          --slug ${{ matrix.slug }} --version ${{ env.RELEASE_TAG }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: InkLimner-${{ matrix.slug }}
          path: release/*.zip
          if-no-files-found: error

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          generate_release_notes: true
