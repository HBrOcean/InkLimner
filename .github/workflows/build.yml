name: Build release packages

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write          # 发布 Release 需要写权限

jobs:
  build:
    name: build-${{ matrix.slug }}
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
      # Windows 控制台默认 cp1252，强制 UTF-8 免得打印中文时崩
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            slug: windows
          - os: macos-latest
            slug: macos
          - os: ubuntu-latest
            slug: linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install opencv-python-headless numpy pyinstaller PySide6-Essentials

      - name: Build CLI (single file)
        run: >
          python -m PyInstaller --noconfirm --onefile --name inklimner
          --exclude-module PySide6 --exclude-module shiboken6
          inklimner.py

      - name: Build GUI (folder bundle, double-click to run)
        run: >
          python -m PyInstaller --noconfirm --name InkLimner --windowed
          --exclude-module tkinter --exclude-module PIL
          inklimner_gui.py

      - name: Smoke test the built executables
        run: python tools/smoke_test.py


        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          retention-days: 30

      # ---------- 打成规范命名的 zip（给 Release 用） ----------
      - name: Package release zips
        run: >
          python tools/make_release.py
          --slug ${{ matrix.slug }} --version ${{ env.RELEASE_TAG }}

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          generate_release_notes: true

      - name: Job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## InkLimner ${{ env.RELEASE_TAG }} · ${{ matrix.slug }}"
            echo ""
            echo '```'
            ls -lh dist/ 2>/dev/null || echo "(no dist)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
