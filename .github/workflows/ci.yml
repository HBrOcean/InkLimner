name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: py${{ matrix.python-version }} @ ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install Qt runtime libs (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: pytest -q

      - name: Smoke test (CLI)
        shell: bash
        run: |
          python inklimner.py --version
          python inklimner.py examples/sample.png -o /tmp/smoke.svg --mode linedraw --trim

      - name: Smoke test (GUI, headless)
        shell: bash
        run: |
          if ! python -c "import PySide6" 2>/dev/null; then
            echo "PySide6 unavailable — skipping GUI self-check"
            exit 0
          fi
          python -c "from pathlib import Path; import PySide6; d=Path(PySide6.__file__).parent/'Qt'/'plugins'/'platforms'; print('Qt platform plugins:', sorted(p.name for p in d.iterdir()) if d.is_dir() else 'not found')"
          # Linux / macOS 的 runner 没有显示器，必须走 offscreen；
          # Windows runner 自带桌面会话，用默认平台更贴近真实运行环境。
          if [ "$RUNNER_OS" = "Linux" ] || [ "$RUNNER_OS" = "macOS" ]; then
            export QT_QPA_PLATFORM=offscreen
          fi
          python inklimner_gui_qt.py --selftest
