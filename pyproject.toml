[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "inklimner"
version = "3.4.1.1"
description = "Turn raster images into pure-stroke, single-line SVG art for laser cutting — CLI + GUI, with DPI-accurate sizing and batch mode."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Oceaniat" }]
keywords = [
    "svg", "laser-cutting", "laser-engraving", "vectorization",
    "line-art", "lightburn", "potrace", "opencv", "xdog", "centerline", "gui",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]
dependencies = [
    "opencv-python>=4.5",
    "numpy>=1.20",
]

[project.optional-dependencies]
fast = ["opencv-contrib-python>=4.5"]
gui = ["PySide6-Essentials>=6.5"]
tk = ["Pillow>=9"]
dnd = ["tkinterdnd2>=0.3"]
dev = ["pytest>=7", "ruff>=0.5", "Pillow>=9", "PySide6-Essentials>=6.5"]

[project.urls]
Homepage = "https://github.com/HBrOcean/inklimner"
Repository = "https://github.com/HBrOcean/inklimner"
Issues = "https://github.com/HBrOcean/inklimner/issues"
Changelog = "https://github.com/HBrOcean/inklimner/blob/main/CHANGELOG.md"

[project.scripts]
inklimner = "inklimner:main"
inklimner-gui = "inklimner_gui:main"

[tool.setuptools]
py-modules = [
    "inklimner",
    "inklimner_gui",
    "inklimner_gui_core",
    "inklimner_gui_qt",
    "inklimner_gui_tk",
]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
